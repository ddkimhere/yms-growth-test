<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YMS Growth Test Login</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#eef1f6;color:#202837}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:18px;box-shadow:0 18px 60px rgba(22,38,74,.14);padding:24px;margin-bottom:16px}.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mark{width:48px;height:48px;border-radius:13px;background:#16264a;color:#fff;display:grid;place-items:center;font-weight:900}.title{font-size:22px;font-weight:900;color:#16264a}.sub{font-size:12px;color:#6b7686}.seg{display:inline-flex;background:#e9eef6;border-radius:10px;padding:3px;margin-bottom:14px}.seg button{border:0;background:transparent;padding:8px 15px;border-radius:8px;font-weight:800;color:#6b7686}.seg .on{background:#fff;color:#16264a;box-shadow:0 1px 3px #bbb}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#6b7686;font-weight:800;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d7e2f3;border-radius:9px;font-size:14px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:900;cursor:pointer}.primary{width:100%;background:#16264a;color:#fff;margin-top:10px}.green{background:#1d9e75;color:#fff}.ghost{background:#eef3fb;color:#16264a}.err{font-size:12px;color:#e24b4a;font-weight:800;min-height:20px;margin-top:8px}.ok{color:#1d9e75}.top{display:flex;align-items:center;gap:8px}.spacer{flex:1}.grid{display:grid;grid-template-columns:1.2fr 1fr 1.3fr auto;gap:10px;align-items:end}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f4;text-align:center;font-size:12px}.table th{background:#f3f6fa;color:#6b7686}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{margin:10px auto}.table{font-size:11px}}</style></head><body>
<div class="wrap"><div class="card" id="loginCard"><div class="logo"><div class="mark">YMS</div><div><div class="title">Growth Test 로그인</div><div class="sub">운영자가 등록한 선생님만 사용할 수 있습니다.</div></div></div><div class="seg" id="modes"><button data-mode="teacher" class="on">선생님</button><button data-mode="admin">운영자</button></div><div id="teacherFields" class="field"><label>휴대폰 끝 4자리</label><input id="last4" maxlength="4" inputmode="numeric" placeholder="예: 0219"></div><div id="adminFields" class="field hidden"><label>운영자 이메일</label><input id="email" type="email" placeholder="admin@example.com"></div><div class="field"><label>비밀번호</label><input id="pw" type="password" placeholder="비밀번호"></div><button class="btn primary" id="login">로그인</button><div class="err" id="loginMsg"></div></div>
<div class="card hidden" id="adminCard"><div class="top"><div><div class="title" style="font-size:18px">선생님 계정 관리</div><div class="sub">휴대폰 끝 4자리 + 비밀번호로 로그인합니다.</div></div><div class="spacer"></div><button class="btn ghost" id="goApp">프로그램 열기</button><button class="btn ghost" id="logout">로그아웃</button></div><div class="grid" style="margin-top:16px"><div class="field"><label>선생님 이름</label><input id="tName" placeholder="김선생"></div><div class="field"><label>휴대폰 끝 4자리</label><input id="tLast4" maxlength="4" inputmode="numeric" placeholder="1234"></div><div class="field"><label>초기 비밀번호</label><input id="tPw" type="password" placeholder="6자 이상"></div><button class="btn green" id="add">등록</button></div><div class="err" id="adminMsg"></div><table class="table"><thead><tr><th>이름</th><th>끝 4자리</th><th>상태</th><th>권한</th><th>관리</th></tr></thead><tbody id="teachers"></tbody></table></div></div>
<script>
const cfg={apiKey:'AIzaSyBHFzS1vB0PN0kkt8gzTaXPJnvZQAP1qts',authDomain:'yms-growth-test.firebaseapp.com',projectId:'yms-growth-test',storageBucket:'yms-growth-test.firebasestorage.app',messagingSenderId:'1036597002427',appId:'1:1036597002427:web:716e182ab1173ba3b6699e',measurementId:'G-NGS2N0KE1Z'};firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);let mode='teacher',profile=null;
function tEmail(x){return `teacher-${String(x).replace(/\D/g,'')}@yms-growth.local`}function msg(e){const c=e?.code||'';return {'auth/invalid-credential':'로그인 정보를 확인해 주세요.','auth/invalid-email':'로그인 정보를 확인해 주세요.','auth/email-already-in-use':'이미 등록된 끝 4자리입니다.','auth/weak-password':'비밀번호는 6자 이상으로 설정해 주세요.','auth/too-many-requests':'잠시 후 다시 시도해 주세요.'}[c]||e?.message||'오류가 발생했습니다.'}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));$('teacherFields').classList.toggle('hidden',mode!=='teacher');$('adminFields').classList.toggle('hidden',mode!=='admin');$('loginMsg').textContent=''});
$('login').onclick=async()=>{try{$('loginMsg').textContent='';let em;if(mode==='teacher'){const x=$('last4').value.replace(/\D/g,'');if(x.length!==4)throw new Error('휴대폰 끝 4자리를 입력해 주세요.');em=tEmail(x)}else{em=$('email').value.trim();if(!em)throw new Error('운영자 이메일을 입력해 주세요.')}await auth.signInWithEmailAndPassword(em,$('pw').value)}catch(e){$('loginMsg').textContent=msg(e)}};
async function ensure(u){const r=db.collection('teachers').doc(u.uid),s=await r.get();if(s.exists)return {uid:u.uid,...s.data()};const ar=db.collection('system').doc('admin');return db.runTransaction(async tx=>{const a=await tx.get(ar);if(!a.exists){const p={name:'운영자',role:'admin',active:true,email:u.email||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()};tx.set(ar,{uid:u.uid,email:u.email||''});tx.set(r,p);return {uid:u.uid,...p}}if(a.data().uid===u.uid){const p={name:'운영자',role:'admin',active:true,email:u.email||''};tx.set(r,p,{merge:true});return {uid:u.uid,...p}}throw new Error('운영자가 등록하지 않은 계정입니다.')})}
async function listTeachers(){if(profile?.role!=='admin')return;const s=await db.collection('teachers').orderBy('name').get();$('teachers').innerHTML=s.docs.map(d=>{const x=d.data(),me=d.id===auth.currentUser.uid;return `<tr><td>${x.name||'-'}</td><td>${x.last4||'운영자'}</td><td>${x.active!==false?'사용중':'중지'}</td><td>${x.role==='admin'?'운영자':'선생님'}</td><td>${me?'—':`<button class="btn ghost tog" data-id="${d.id}" data-on="${x.active!==false}">${x.active!==false?'사용중지':'다시 사용'}</button>`}</td></tr>`}).join('');document.querySelectorAll('.tog').forEach(b=>b.onclick=async()=>{await db.collection('teachers').doc(b.dataset.id).update({active:b.dataset.on!=='true'});listTeachers()})}
$('add').onclick=async()=>{if(profile?.role!=='admin')return;const n=$('tName').value.trim(),l=$('tLast4').value.replace(/\D/g,''),p=$('tPw').value;$('adminMsg').className='err';$('adminMsg').textContent='';try{if(!n||l.length!==4||p.length<6)throw new Error('이름, 끝 4자리, 6자 이상 비밀번호를 확인해 주세요.');const q=await db.collection('teachers').where('last4','==',l).limit(1).get();if(!q.empty)throw new Error('이미 등록된 끝 4자리입니다.');const sec=firebase.apps.find(a=>a.name==='creator')||firebase.initializeApp(cfg,'creator'),sa=sec.auth(),cr=await sa.createUserWithEmailAndPassword(tEmail(l),p);await db.collection('teachers').doc(cr.user.uid).set({name:n,last4:l,role:'teacher',active:true,authEmail:tEmail(l),createdBy:auth.currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await sa.signOut();$('tName').value=$('tLast4').value=$('tPw').value='';$('adminMsg').className='err ok';$('adminMsg').textContent='등록했습니다.';listTeachers()}catch(e){$('adminMsg').textContent=msg(e)}};
$('logout').onclick=()=>auth.signOut();$('goApp').onclick=()=>location.href='./';auth.onAuthStateChanged(async u=>{if(!u){profile=null;$('loginCard').classList.remove('hidden');$('adminCard').classList.add('hidden');return}try{profile=await ensure(u);if(profile.active===false)throw new Error('사용이 중지된 계정입니다.');if(profile.role==='admin'){$('loginCard').classList.add('hidden');$('adminCard').classList.remove('hidden');listTeachers()}else{location.href='./'}}catch(e){await auth.signOut();$('loginMsg').textContent=msg(e)}});
</script></body></html>
