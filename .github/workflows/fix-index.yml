name: Repair index
on:
  push:
    paths:
      - '.github/workflows/fix-index.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Restore good index and blank student answer placeholder
        run: |
          git show 0a8ae537a77935f7ec090143f60ec459ad8efd4f:index.html > index.html
          sed -i 's/ placeholder="1~5"//g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep student answer fields blank"
          git push
