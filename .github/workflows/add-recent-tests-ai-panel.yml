name: Add recent tests to AI panel
'on':
  push:
    paths:
      - '.github/workflows/add-recent-tests-ai-panel.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: python .github/scripts/patch_recent_tests.py
      - name: Commit changes
        run: |
          rm .github/workflows/add-recent-tests-ai-panel.yml
          rm .github/scripts/patch_recent_tests.py
          git config user.name "ddkimhere"
          git config user.email "ddkim1984@gmail.com"
          git add index.html .github/workflows/add-recent-tests-ai-panel.yml .github/scripts/patch_recent_tests.py
          git commit -m "Show recent student tests beside AI evaluation"
          git push
