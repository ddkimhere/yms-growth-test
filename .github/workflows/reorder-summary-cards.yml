name: Reorder summary cards
on:
  push:
    paths:
      - '.github/workflows/reorder-summary-cards.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder report summary cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="metrics"><div class="metric"><div class="k">정답 문항</div><div class="v">${c.correct}/${c.totalQuestions}</div><div class="sub">현재 입력 기준</div></div><div class="metric"><div class="k">가장 강한 영역</div><div class="v" style="font-size:16px">${strong.a}</div><div class="sub">${strong.v}%</div></div><div class="metric"><div class="k">우선 보완 영역</div><div class="v" style="font-size:16px">${weak.a}</div><div class="sub">${weak.v}%</div></div><div class="metric"><div class="k">시험 수준</div><div class="v" style="font-size:16px">${esc($('testCode').value)}</div><div class="sub">${esc($('difficultyMemo').value)}</div></div></div>'''
          new='''<div class="metrics"><div class="metric"><div class="k">시험 수준</div><div class="v" style="font-size:16px">${esc($('testCode').value)}</div><div class="sub">${esc($('difficultyMemo').value)}</div></div><div class="metric"><div class="k">정답 문항</div><div class="v">${c.correct}/${c.totalQuestions}</div><div class="sub">현재 입력 기준</div></div><div class="metric"><div class="k">가장 강한 영역</div><div class="v" style="font-size:16px">${strong.a}</div><div class="sub">${strong.v}%</div></div><div class="metric"><div class="k">우선 보완 영역</div><div class="v" style="font-size:16px">${weak.a}</div><div class="sub">${weak.v}%</div></div></div>'''
          if old not in s:
              raise SystemExit('Target metrics block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'ddkimhere'
          git config user.email 'ddkim1984@gmail.com'
          git add index.html
          git commit -m 'Reorder report summary cards'
          git rm .github/workflows/reorder-summary-cards.yml
          git commit -m 'Remove one-time summary card workflow'
          git push
