name: Fix AI comment render loop
on:
  push:
    paths:
      - '.github/workflows/fix-ai-comment-loop.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AI comment render loop
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(p)p.textContent=text;"
          new="if(p && p.textContent!==text)p.textContent=text;"
          count=s.count(old)
          if count < 1:
              raise SystemExit('AI comment assignment not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          print('patched', count, 'occurrence(s)')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/fix-ai-comment-loop.yml
          git config user.name "ddkimhere"
          git config user.email "ddkim1984@gmail.com"
          git add index.html .github/workflows/fix-ai-comment-loop.yml
          git commit -m "Prevent AI comment MutationObserver loop"
          git push
