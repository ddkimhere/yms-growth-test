  'M3-6':'고1 6월 전국연합 종합 실전 최상 난도로, 복합 추론·논리 구조·고급 어휘를 종합적으로 평가합니다.',
  'H1-1':'고2 전국연합 수준으로, 높은 수준의 어휘와 추상적 소재, 복합 문장 및 논증 관계를 종합적으로 처리하는 능력을 평가합니다.'
