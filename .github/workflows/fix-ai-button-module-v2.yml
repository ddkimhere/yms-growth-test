let aiModelPromise=null;
async function getYmsAiModel(){
  if(!aiModelPromise){
    aiModelPromise=(async()=>{
      const app=initializeModularApp(firebaseConfig,'yms-ai-evaluation');
      const ai=getAI(app,{backend:new GoogleAIBackend()});
      return getGenerativeModel(ai,{
        model:'gemini-3.5-flash-lite',
        systemInstruction:`당신은 YMS Growth Test의 영어 교육 평가서를 작성하는 전문 교사입니다. 학부모에게 전달할 담당교사 Comment를 한국어로 작성하세요. 제공된 데이터에 없는 사실은 절대 만들지 마세요. 점수와 영역별 성취도를 정확히 반영하고, 학생을 단정적으로 낙인찍지 마세요. 반드시 1) 이번 시험의 객관적인 난이도 설명, 2) 현재 성취와 강점, 3) 보완이 필요한 영역과 근거, 4) 다음 학습 방향을 자연스럽게 하나의 코멘트로 연결하세요. 과장된 칭찬이나 불필요한 수식은 피하고, 학부모가 이해하기 쉬운 전문적인 문체를 사용하세요. 5~7문장, 약 350~550자 내외로 작성하고 제목·불릿·마크다운 없이 본문만 출력하세요.`
      });
    })();
  }
  return aiModelPromise;
}

function currentAiData(){
  const c=calc(), code=$('testCode').value, rows=c.rows||[];
  const wrong=rows.filter(r=>r.ans&&r.key&&r.ans!==r.key).map(r=>({문항:r.n,영역:r.area,유형:r.type}));
  const area=AREAS.map(a=>({영역:a,정답:c.byArea[a]?.correct||0,문항:c.byArea[a]?.total||0,성취도:c.areaPct[a]||0}));
  const name=$('name').value.trim();
  const history=(REPORTS_CACHE||[]).filter(r=>r.name===name&&r.testCode!==code).slice(-3).map(r=>({시험:r.testCode,점수:r.score,평가일:r.date}));
  return {
    학생명:name||'학생', 학교:$('school').value.trim(), 학년:$('grade').value, 시험코드:code,
    시험수준:AI_LEVEL_GUIDE[code]||'해당 회차 기준 난이도', 점수:c.score, 정답수:c.correct, 전체문항:c.totalQuestions, 응답문항:c.answered,
    영역별성취도:area, 오답정보:wrong, 이전평가:history,
    선생님강점메모:$('strengthMemo').value.trim(), 선생님보완메모:$('growthMemo').value.trim()
  };
}

function applyAiCommentToReport(){
  const text=(window.AI_COMMENT||'').trim();
  if(!text)return;
  const p=document.querySelector('#card .comment p');
  if(p)p.textContent=text;
}
const card=document.getElementById('card');
if(card)new MutationObserver(()=>applyAiCommentToReport()).observe(card,{childList:true,subtree:true});

const btn=document.getElementById('generateAiComment');
if(btn) btn.addEventListener('click',async()=>{
  const status=document.getElementById('aiStatus'), out=document.getElementById('aiComment'), data=currentAiData();
  if(!data.학생명||data.학생명==='학생'){status.textContent='학생명을 먼저 입력해 주세요.';status.className='hint ai-status-error';return;}
  if(data.응답문항===0){status.textContent='학생 답을 먼저 입력해 주세요.';status.className='hint ai-status-error';return;}
  btn.disabled=true; btn.textContent='AI 평가서 작성 중…'; status.textContent='시험 결과와 4대 독해 영역을 분석하고 있습니다.'; status.className='hint';
  try{
    const model=await getYmsAiModel();
    const prompt=`다음 YMS Growth Test 결과만을 근거로 담당교사 Comment를 작성하세요.

${JSON.stringify(data,null,2)}

오답 문항이 아직 미응답인 경우에는 오답으로 해석하지 마세요. 이전 평가가 있으면 변화 추이를 과장 없이 한 문장 이내에서 언급할 수 있습니다. 시험 수준 설명은 제공된 문구의 의미를 바꾸지 마세요.`;
    const result=await model.generateContent(prompt);
    const text=(result.response.text()||'').trim();
    if(!text)throw new Error('AI 응답이 비어 있습니다.');
    window.AI_COMMENT=text; out.value=text; applyAiCommentToReport();
    status.textContent='AI 평가서 생성 완료 · 필요한 경우 문장을 직접 수정할 수 있습니다.'; status.className='hint ai-status-ok';
  }catch(e){
    console.error(e);
    const msg=String(e?.message||e);
    status.textContent='AI 평가서 생성 실패: '+msg; status.className='hint ai-status-error';
  }finally{
    btn.disabled=false; btn.textContent='✨ AI 평가서 다시 만들기';
  }
});
const aiTextarea=document.getElementById('aiComment');
if(aiTextarea) aiTextarea.addEventListener('input',()=>{window.AI_COMMENT=aiTextarea.value;applyAiCommentToReport();});
</script>
'
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('\\n<script type="module">\\n')
          if start < 0:
              start=s.find('<script type="module">')
          if start < 0: raise SystemExit('AI module start not found')
          end=s.find('</script>\\n', start)
          if end < 0: end=s.find('</script>', start)
          if end < 0: raise SystemExit('AI module end not found')
          end += len('</script>')
          module=base64.b64decode(os.environ['MODULE_B64']).decode('utf-8')
          s=s[:start]+'\n'+module+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm -f .github/workflows/fix-ai-button-module.yml .github/workflows/fix-ai-button-module-v2.yml
          git config user.name "ddkimhere"
          git config user.email "ddkim1984@gmail.com"
          git add -A
          git commit -m "Fix AI evaluation button script"
          git push
