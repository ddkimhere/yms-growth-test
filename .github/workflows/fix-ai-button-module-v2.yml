jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken AI module
        env:
          MODULE_B64: '%%F7ZW0IOyImOykgOydtOuhnCwg7KSR7IusIOyDneqwgOydhCDslZXstpXtlZjqs6Ag7IOB7Zmp7J2YIOydmOuvuOulvCDstpTr론하며 다의어의 문맥적 의미를 판단하는 능력을 평가합니다.',
