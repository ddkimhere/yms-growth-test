name: Fix AI evaluation button module v3
on:
  push:
    paths:
      - '.github/workflows/fix-ai-button-module-v3.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken AI module
        env:
          MODULE_B64: ''
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('\\n<script type="module">\\n')
          if start < 0:
              start=s.find('<script type="module">')
          if start < 0: raise SystemExit('AI module start not found')
          end=s.find('</script>\\n', start)
          if end < 0: end=s.find('</script>', start)
          if end < 0: raise SystemExit('AI module end not found')
          end += len('</script>')
          module=base64.b64decode(os.environ['MODULE_B64']).decode('utf-8')
          s=s[:start]+'\n'+module+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm -f .github/workflows/fix-ai-button-module.yml .github/workflows/fix-ai-button-module-v2.yml .github/workflows/fix-ai-button-module-v3.yml
          git config user.name "ddkimhere"
          git config user.email "ddkim1984@gmail.com"
          git add -A
          git commit -m "Fix AI evaluation button script"
          git push
