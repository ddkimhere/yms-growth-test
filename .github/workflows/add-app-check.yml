name: Add Firebase App Check
on:
  push:
    paths:
      - '.github/workflows/add-app-check.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App Check initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='import { initializeApp as initializeModularApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";\nimport { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-ai.js";'
          new='import { initializeApp as initializeModularApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";\nimport { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app-check.js";\nimport { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-ai.js";'
          if old not in s:
              raise SystemExit('AI module imports not found')
          s=s.replace(old,new,1)
          old2="""      const app=initializeModularApp(firebaseConfig,'yms-ai-evaluation');
      const ai=getAI(app,{backend:new GoogleAIBackend()});"""
          new2="""      const app=initializeModularApp(firebaseConfig,'yms-ai-evaluation');
      initializeAppCheck(app,{
        provider:new ReCaptchaEnterpriseProvider('6Ldq4YgtAAAAALQVJCU0XqmKGBR-cedGh77SBCEC'),
        isTokenAutoRefreshEnabled:true
      });
      const ai=getAI(app,{backend:new GoogleAIBackend()});"""
          if old2 not in s:
              raise SystemExit('AI app initialization block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/add-app-check.yml
          git config user.name "ddkimhere"
          git config user.email "ddkim1984@gmail.com"
          git add index.html .github/workflows/add-app-check.yml
          git commit -m "Initialize Firebase App Check for AI evaluation"
          git push
