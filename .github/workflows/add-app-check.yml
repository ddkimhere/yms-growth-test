name: Add Firebase App Check
on:
  push:
    paths:
      - '.github/workflows/add-app-check.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: python .github/scripts/add_app_check.py
      - name: Commit changes
        run: |
          rm .github/workflows/add-app-check.yml
          rm .github/scripts/add_app_check.py
          git config user.name "ddkimhere"
          git config user.email "ddkim1984@gmail.com"
          git add index.html .github/workflows/add-app-check.yml .github/scripts/add_app_check.py
          git commit -m "Initialize Firebase App Check for AI evaluation"
          git push
