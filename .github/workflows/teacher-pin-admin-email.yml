name: Teacher PIN and admin email login
on:
  push:
    paths:
      - '.github/workflows/teacher-pin-admin-email.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python scripts/patch_teacher_access.py
      - name: Commit changes
        run: |
          git config user.name "ddkimhere"
          git config user.email "ddkim1984@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use teacher PIN login and admin email login"
          git push
